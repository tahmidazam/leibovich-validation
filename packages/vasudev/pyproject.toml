[project]
name = "lv-vasudev"
version = "0.1.0"
description = "Vasudev cohort adapter for leibovich-validation"
requires-python = ">=3.14"
dependencies = ["lv-datasets", "polars>=2.1.0"]

[project.entry-points."leibovich_validation.datasets"]
vasudev = "lv_vasudev:dataset"

[build-system]
requires = ["uv_build>=0.12.1,<0.13.0"]
build-backend = "uv_build"

[tool.uv.sources]
lv-datasets = { workspace = true }

[tool.ruff]
extend = "../../pyproject.toml"

[tool.ruff.lint.flake8-tidy-imports.banned-api]
"leibovich_validation".msg = "adapters must not import the analysis app"
