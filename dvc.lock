          - - A
            - B
          sharex: true
          sharey: true
          legend:
            loc: outside lower center
            ncol: 3
          panels:
            A:
              draw: calibration
              table: calibration_5y
              where:
                stratum: TranSORCE
                bound: pt3a
              title: '{stratum} (n = {cohort_n:,}; {events} metastases)'
              xlabel: Predicted 5-year risk of distant metastasis
              ylabel: Observed 5-year risk
            B:
              draw: calibration
              table: calibration_5y
              where:
                stratum: Vasudev cohort
                bound: pt3a
              title: '{stratum} (n = {cohort_n:,}; {events} relapses)'
              xlabel: Predicted 5-year risk of distant metastasis
          caption: Calibration of predicted 5-year risk. Lines are smoothed 
            calibration curves; points are fifths of predicted risk with 95% 
            bootstrap percentile intervals. The dashed line marks perfect 
            calibration, and the ticks at the foot of each panel show the spread
            of each model's predicted risk. In TranSORCE, follow-up starts at 
            randomisation, the event is distant metastasis and predictions are 
            conditional on being event-free at randomisation. In the Vasudev 
            cohort, follow-up starts at surgery and the event is any relapse. 
            Death without the event is the competing event in both. Relapse 
            includes every distant metastasis, so in B a point below the dashed 
            line shows over-prediction but a point above it does not show 
            under-prediction.
        style:
          font.family: sans-serif
          font.sans-serif: DejaVu Sans
          font.size: 8
          axes.titlesize: 8
