      params.yaml:
        reporting:
          minimum_group_n: 10
          minimum_at_risk: 20
          behaviour_ages:
          - 55
          - 65
          - 75
          - 85
          behaviour_time_step: 0.25
          behaviour_sex: male
          calibration_bins: 5
          calibration_rug_points: 25
          calibration_bandwidth: 0.05
      manuscript.yaml:
        figure.model_behaviour:
          label: Figure S1
          placement: supplement
          size:
          - 183
          - 75
          mosaic:
          - - A
            - B
            - C
          sharex: true
          sharey: true
          legend:
            loc: outside lower center
            ncol: 6
            stratum_label: age {}
          panels:
            A:
              draw: curve
              table: model_behaviour
              where:
                label: low
              title: Low-risk profile
              xlabel: Years since surgery
              ylabel: Predicted risk of distant metastasis
            B:
              draw: curve
              table: model_behaviour
              where:
                label: intermediate
              title: Intermediate-risk profile
              xlabel: Years since surgery
            C:
              draw: curve
              table: model_behaviour
              where:
                label: high
              title: High-risk profile
              xlabel: Years since surgery
          caption: Predicted cumulative incidence of distant metastasis in men 
            for the three tumour profiles of Stimpson et al., defined in Table 
            S2. The original Leibovich model does not use age, so it has one 
            curve per profile. Leibovich Plus divides the risk of either event 
            in proportion to the two cumulative risks, so its predicted risk can
            fall as follow-up lengthens, as in the high-risk profile at older 
            ages.
        style:
          font.family: sans-serif
          font.sans-serif: DejaVu Sans
          font.size: 8
          axes.titlesize: 8
          axes.labelsize: 8
          xtick.labelsize: 7
          ytick.labelsize: 7
          legend.fontsize: 7
          pdf.fonttype: 42
          axes.spines.top: false
          axes.spines.right: false
          axes.grid: true
          axes.axisbelow: true
          grid.color: '0.9'
          grid.linewidth: 0.6
          legend.frameon: false
          lines.linewidth: 1.4
